## monadial/.github reusable build workflow
##
## Build -> scan (Trivy, before push) -> push -> sign (cosign, keyless) -> write
## back the resulting digest into the calling app's deploy manifest in a
## SEPARATE repository, via a GitHub App installation token (never a repo/org
## PAT). See ../../WORKFLOWS.md for the full caller contract (required
## inputs/secrets, the paths-ignore loop-guard callers MUST set, and the
## action allowlist to paste into org Settings -> Actions -> "Allow select
## actions").
##
## v1.0.3 (2026-08-26, SUPERSEDED by v1.0.4 same day): first attempt at
## dual-publishing the cosign signature under the legacy pre-OCI-1.1
## `<repo>:sha256-<digest>.sig` tag via `cosign sign --registry-referrers-
## mode=legacy`. Live-tested against a real CI run and DISPROVEN: on this
## registry, that flag does not actually write a distinct `.sig`-suffixed
## tag (both the default and the explicit-legacy sign calls land on the
## same OCI-referrers fallback-tag index) — see v1.0.4's notes below and
## the `Publish legacy signature tag` step's own comment for the full
## live-diagnosis trail.
##
## v1.0.4 (2026-08-26, SUPERSEDED by v1.0.5 same day): got the TAG NAME
## right (`<repo>:sha256-<digest>.sig` did start existing) via a plain
## registry-API GET+PUT copy of the signature manifest `cosign sign`
## already published — but not the CONTENT SHAPE. Live-tested against a
## real CI run and DISPROVEN by the cluster's own reports-controller:
## Kyverno's vendored cosign v3.1.2 rejected the copied manifest ("no
## matching signatures: signature layer ... is missing
## \"dev.cosignproject.cosign/signature\" annotation") because `cosign
## sign` publishes the MODERN Sigstore-bundle-format signature, but
## Kyverno's legacy-tag reader only understands the OLDER "simple
## signing" annotation layout. See v1.0.5's notes below.
##
## v1.0.5 (2026-08-26): the working fix. Same underlying cryptographic
## material (DSSE payload, raw signature, Fulcio cert, Rekor inclusion
## proof) as v1.0.4 — no re-signing — but reshaped into the classic
## annotation layout Kyverno v3.1.2's legacy reader expects
## (`pkg/oci/internal/signature/layer.go` in that exact cosign version),
## and published via `cosign attach signature` (cosign's own older,
## still-functional legacy-format writer) rather than hand-copied JSON.
## Confirmed via a real registry round-trip test (not just source-
## reading) that `attach signature` correctly targets the `.sig` tag
## directly, unlike `cosign sign --registry-referrers-mode=legacy`
## (v1.0.3, reverted). See the `build` job's `Publish legacy signature
## tag` + `Verify legacy signature tag exists` steps for the full
## mechanics; the authoritative cluster-side diagnosis lives in
## monadial-cloud's own gitops/platform/kyverno/policies-images.yaml
## header comment.
##
## Every third-party `uses:` below is pinned to a full 40-char commit SHA,
## with the human-readable release tag it currently resolves to as a
## trailing comment. Re-resolve with:
##   gh api repos/<owner>/<repo>/commits/<tag> --jq '.sha'
## (dereferences annotated tags to the commit automatically) before bumping
## any pin.

name: build

# Quoted: bare `on:` is a YAML 1.1 boolean literal (resolves to `true`) —
# quoting keeps it a string key so strict YAML linters don't flag it.
# GitHub's own workflow parser accepts either form identically.
"on":
  workflow_call:
    inputs:
      image:
        description: >-
          Fully-qualified image repository, no tag/digest, e.g.
          rg.nl-ams.scw.cloud/monadial/hello
        required: true
        type: string
      context:
        description: Docker build context path, relative to the calling repo root.
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile, relative to the calling repo root.
        required: true
        type: string
      writeback_repo:
        description: >-
          owner/repo of the deploy-manifest repository to pin the built
          digest into, e.g. monadial/hello
        required: true
        type: string
      writeback_path:
        description: >-
          Path (within writeback_repo) to the file whose image reference
          line gets updated to the new digest.
        required: true
        type: string
      writeback_regex:
        description: >-
          Extended-regex (grep -E / sed -E compatible) matching the exact
          image reference line/value in writeback_path to replace. Must
          match at least one line or the write-back job fails on purpose.
        required: true
        type: string
      platforms:
        description: Comma-separated buildx platform list. Single-platform only (load+push flow).
        required: false
        type: string
        default: linux/amd64
      tag:
        description: >-
          Tag to build/scan/push under before signing by digest. Defaults
          to the calling workflow run's commit SHA when not supplied.
        required: false
        type: string
        default: ""
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: >-
          Org-level 1Password service-account token (read-only, vault
          monadial-cloud). Required — this workflow authenticates to
          1Password with it in every job. If the org secret does not
          exist or is not shared with the calling repo, every job fails
          fast with an explicit ::error:: rather than a cryptic
          1Password-CLI auth failure.
        required: true
    outputs:
      digest:
        description: sha256 digest of the pushed, signed image.
        value: ${{ jobs.build.outputs.digest }}

# Hygiene default (§11.4): no ambient token permissions anywhere in this
# workflow unless a job explicitly grants itself what it needs.
permissions: {}

jobs:
  build:
    name: build, scan, push, sign
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # cosign keyless: mints the OIDC token Fulcio exchanges for a cert
      contents: read  # actions/checkout of the calling repo
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Preflight — verify OP_SERVICE_ACCOUNT_TOKEN is present
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if [ -z "${OP_SERVICE_ACCOUNT_TOKEN}" ]; then
            echo "::error::OP_SERVICE_ACCOUNT_TOKEN org secret is missing or empty." >&2
            echo "This workflow needs it to authenticate to 1Password (vault monadial-cloud)." >&2
            echo "See WORKFLOWS.md prerequisite 3 — ask an org admin to share the org secret with this repo." >&2
            exit 1
          fi

      - name: Load registry push credentials from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2  # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCW_ACCESS_KEY: op://monadial-cloud/scw-registry-push-ci/credentials/access_key
          SCW_SECRET_KEY: op://monadial-cloud/scw-registry-push-ci/credentials/secret_key

      - name: Determine build tag
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker login (Scaleway registry)
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          registry="${IMAGE%%/*}"
          echo "${SCW_SECRET_KEY}" | docker login "${registry}" --username "${SCW_ACCESS_KEY}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build image (local only — nothing pushed yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: false
          load: true
          tags: ${{ inputs.image }}:${{ steps.vars.outputs.tag }}

      - name: Scan with Trivy (gate — must pass before anything is pushed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ inputs.image }}:${{ steps.vars.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Push image (the exact scanned bytes)
        # Review fix (T3, 2026-08-26): a second build-push-action call here
        # was a REBUILD whose identity with the scanned image rested on an
        # unproven cache hit — the classic scan-then-swap window. A plain
        # `docker push` of the tag ALREADY LOADED into the daemon pushes the
        # byte-identical image Trivy just scanned, by construction.
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker push "${IMAGE}:${TAG}"

      - name: Resolve pushed digest
        id: digest
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          # Pull (rather than trust the local buildx load) so the local
          # daemon records RepoDigests against a reference it fetched from
          # the registry itself.
          docker pull "${IMAGE}:${TAG}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${TAG}" | sed -E 's#^.*@##')"
          if [ -z "${digest}" ]; then
            echo "::error::Could not resolve a pushed digest for ${IMAGE}:${TAG} — RepoDigests empty after pull." >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          # Keyless: identity = this job's OIDC token (id-token: write
          # above), Fulcio-issued short-lived cert, Rekor transparency-log
          # entry. cosign >=2.x bundles the Rekor SET into the signature by
          # default, so `cosign verify --offline --bundle` works later
          # without a live Rekor round-trip (§1).
          #
          # No --registry-referrers-mode flag here: cosign's own default
          # (OCI 1.1 Referrers API, falling back transparently to the
          # OCI-1.1 "fallback tag" object <repo>:sha256-<digest> — no
          # `.sig` suffix — on registries like Scaleway's that don't
          # implement the native Referrers API) is what this repo has
          # always published under. Kept unchanged; the dual-publish step
          # immediately below ADDS the legacy reference on top of this,
          # it doesn't replace it.
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify signature offline (Rekor bundle attached — §1 requirement)
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          # Proves the just-created signature verifies WITHOUT network access
          # to Rekor (bundle embedded) — the offline-capability the cluster's
          # verifyImages admission relies on during a Sigstore outage.
          cosign verify --offline \
            --certificate-identity-regexp '^https://github.com/monadial/\.github/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"

      - name: Publish legacy signature tag (Kyverno-vendored-cosign compatibility)
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          # SCW_ACCESS_KEY / SCW_SECRET_KEY: already ambient in this job's
          # environment since the "Load registry push credentials from
          # 1Password" step (export-env: true) — reused here directly for
          # the registry token-auth exchange below.
          #
          # WHY this step exists (history, newest first — read before
          # touching this):
          #
          # v1.0.5 (this version): v1.0.4's raw manifest COPY approach got
          # the TAG NAME right (`<repo>:sha256-<digest>.sig` did start
          # existing, confirmed via curl) but not the CONTENT SHAPE: it
          # copied cosign's modern Sigstore-bundle-format signature
          # manifest verbatim, and Kyverno's vendored cosign v3.1.2
          # rejected it live (`no matching signatures: signature layer ...
          # is missing "dev.cosignproject.cosign/signature" annotation`,
          # confirmed via the reports-controller's own logs). Kyverno's
          # legacy-tag reader (pkg/oci/internal/signature/layer.go in
          # cosign v3.1.2, the exact version Kyverno 3.9.0 vendors) parses
          # a completely different, older manifest shape: a layer whose
          # OCI annotations carry `dev.cosignproject.cosign/signature`
          # (base64 raw signature), `dev.sigstore.cosign/certificate` (PEM
          # leaf cert), and `dev.sigstore.cosign/bundle` (a JSON
          # `RekorBundle` — NOT the modern `dev.sigstore.bundle.v0.3+json`
          # protobuf format `cosign sign` publishes by default).
          #
          # This step converts formats: it fetches the bundle `cosign
          # sign` (previous step) already published, extracts the exact
          # same cryptographic material (DSSE payload bytes, raw
          # signature, Fulcio cert, Rekor inclusion proof — nothing new is
          # signed), reshapes it into the classic annotation layout, and
          # publishes via `cosign attach signature` (cosign's own
          # legacy-format writer — NOT hand-built JSON, to avoid getting
          # a byte shape subtly wrong). Confirmed via a real registry
          # round-trip test against this exact registry (not just cosign
          # source-reading, which had already been wrong once for this
          # gap — see v1.0.3/v1.0.4 history in the file header) that
          # `cosign attach signature` correctly targets
          # `<repo>:sha256-<digest>.sig` directly — unlike plain `cosign
          # sign --registry-referrers-mode=legacy` (v1.0.3, reverted:
          # empirically landed on the SAME fallback-tag index as the
          # default call, no `.sig` tag ever created), `attach signature`
          # is the OLDER, still-fully-functional command surface this
          # exact use case was kept working for.
          #
          # Full diagnosis history: gitops/platform/kyverno/policies-
          # images.yaml (monadial-cloud repo) header comment.
          registry="${IMAGE%%/*}"
          repo="${IMAGE#*/}"
          fallback_tag="sha256-${DIGEST#sha256:}"

          www_auth="$(curl -sI "https://${registry}/v2/" | grep -i '^www-authenticate:' | tr -d '\r')"
          realm="$(echo "${www_auth}" | sed -E 's/.*realm="([^"]+)".*/\1/')"
          service="$(echo "${www_auth}" | sed -E 's/.*service="([^"]+)".*/\1/')"
          if [ -z "${realm}" ]; then
            echo "::error::Could not parse WWW-Authenticate realm from https://${registry}/v2/" >&2
            exit 1
          fi
          token="$(curl -sf -u "${SCW_ACCESS_KEY}:${SCW_SECRET_KEY}" \
            "${realm}?service=${service}&scope=repository:${repo}:pull,push" | jq -r '.token')"
          if [ -z "${token}" ] || [ "${token}" = "null" ]; then
            echo "::error::Could not obtain a registry bearer token for ${repo}" >&2
            exit 1
          fi

          # Find the signature manifest cosign sign (previous step) just
          # published inside the fallback-tag index, then fetch its layer
          # blob — the raw Sigstore bundle JSON.
          idx_accept="application/vnd.oci.image.index.v1+json"
          idx_accept="${idx_accept},application/vnd.docker.distribution.manifest.list.v2+json"
          idx_json="$(curl -sf -H "Authorization: Bearer ${token}" \
            -H "Accept: ${idx_accept}" \
            "https://${registry}/v2/${repo}/manifests/${fallback_tag}")"
          sig_manifest_digest="$(echo "${idx_json}" | jq -r '.manifests[-1].digest')"
          if [ -z "${sig_manifest_digest}" ] || [ "${sig_manifest_digest}" = "null" ]; then
            echo "::error::No signature manifest inside ${IMAGE}:${fallback_tag} — cosign sign may have failed." >&2
            exit 1
          fi
          manifest_json="$(curl -sf -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://${registry}/v2/${repo}/manifests/${sig_manifest_digest}")"
          layer_digest="$(echo "${manifest_json}" | jq -r '.layers[0].digest')"
          if [ -z "${layer_digest}" ] || [ "${layer_digest}" = "null" ]; then
            echo "::error::Signature manifest ${sig_manifest_digest} has no layer." >&2
            exit 1
          fi
          curl -sfL -H "Authorization: Bearer ${token}" \
            "https://${registry}/v2/${repo}/blobs/${layer_digest}" -o bundle.json

          # Reshape: extract the DSSE payload/signature/cert/Rekor-proof
          # already inside the bundle and write the 4 files `cosign attach
          # signature` needs. No re-signing — same bytes, same signature,
          # same cert, same Rekor entry the offline-verify step (previous
          # job step) already proved valid.
          python3 - <<'PYEOF'
          import base64, json

          bundle = json.load(open("bundle.json"))
          dsse = bundle["dsseEnvelope"]
          vm = bundle["verificationMaterial"]
          entry = vm["tlogEntries"][0]

          open("payload.json", "wb").write(base64.b64decode(dsse["payload"]))
          open("sig.b64", "w").write(dsse["signatures"][0]["sig"])

          cert_der_b64 = vm["certificate"]["rawBytes"]
          wrapped = "\n".join(
              cert_der_b64[i : i + 64] for i in range(0, len(cert_der_b64), 64)
          )
          with open("cert.pem", "w") as f:
              f.write(f"-----BEGIN CERTIFICATE-----\n{wrapped}\n-----END CERTIFICATE-----\n")

          key_id_hex = base64.b64decode(entry["logId"]["keyId"]).hex()
          rekor_response = {
              "base64Signature": dsse["signatures"][0]["sig"],
              "rekorBundle": {
                  "SignedEntryTimestamp": entry["inclusionPromise"]["signedEntryTimestamp"],
                  "Payload": {
                      "body": entry["canonicalizedBody"],
                      "integratedTime": int(entry["integratedTime"]),
                      "logIndex": int(entry["logIndex"]),
                      "logID": key_id_hex,
                  },
              },
          }
          json.dump(rekor_response, open("rekor-response.json", "w"))
          PYEOF

          cosign attach signature \
            --payload payload.json \
            --signature sig.b64 \
            --certificate cert.pem \
            --rekor-response rekor-response.json \
            "${IMAGE}@${DIGEST}"

      - name: Verify legacy signature tag exists (Kyverno-vendored-cosign compatibility)
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          # Real registry round-trip proving the tag the step above
          # published is actually fetchable AND correctly shaped by the
          # exact access pattern Kyverno's vendored cosign uses — not a
          # cosign opinion, a plain `docker manifest inspect` of the
          # computed tag name (cosign's own legacy AttachedImageTag
          # convention: <algo>-<hex>.sig): asserts it's a bare OCI image
          # manifest (not an index) carrying the classic
          # `dev.cosignproject.cosign/signature` layer annotation —
          # exactly what previously broke (v1.0.4), so this check is what
          # would have caught that regression before it ever reached the
          # cluster.
          sig_tag="sha256-${DIGEST#sha256:}.sig"
          echo "Checking for legacy signature tag: ${IMAGE}:${sig_tag}"
          manifest="$(docker manifest inspect "${IMAGE}:${sig_tag}")"
          media_type="$(echo "${manifest}" | jq -r '.mediaType')"
          sig_annotation_jq='.layers[0].annotations."dev.cosignproject.cosign/signature" // empty'
          sig_annotation="$(echo "${manifest}" | jq -r "${sig_annotation_jq}")"
          echo "mediaType: ${media_type}"
          if [ "${media_type}" != "application/vnd.oci.image.manifest.v1+json" ]; then
            echo "::error::${IMAGE}:${sig_tag} is not a bare OCI image manifest (got mediaType=${media_type})." >&2
            exit 1
          fi
          if [ -z "${sig_annotation}" ]; then
            echo "::error::${IMAGE}:${sig_tag} layer is missing the" >&2
            echo "::error::signature annotation Kyverno's legacy reader requires." >&2
            exit 1
          fi

  writeback:
    name: write back pinned digest
    needs: build
    runs-on: ubuntu-latest
    # NOT contents:write. contents:write on the GITHUB_TOKEN would only
    # grant push rights on the repo THIS workflow is running in (the
    # caller) — irrelevant, since the commit below targets a different
    # repository (writeback_repo). The actual write authority comes
    # entirely from the short-lived GitHub App installation token minted
    # below, scoped by the App install to writeback_repo only. Keeping the
    # ambient GITHUB_TOKEN at contents:read (unused, but the conservative
    # non-empty default) means a bug in this job can never fall back to
    # writing to the calling repo with elevated rights.
    permissions:
      contents: read
    steps:
      - name: Preflight — verify OP_SERVICE_ACCOUNT_TOKEN is present
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if [ -z "${OP_SERVICE_ACCOUNT_TOKEN}" ]; then
            echo "::error::OP_SERVICE_ACCOUNT_TOKEN org secret is missing or empty." >&2
            echo "This workflow needs it to authenticate to 1Password (vault monadial-cloud)." >&2
            echo "See WORKFLOWS.md prerequisite 3 — ask an org admin to share the org secret with this repo." >&2
            exit 1
          fi

      - name: Load GitHub App credentials from 1Password
        # App private key is loaded straight from 1Password into this
        # job's environment and never becomes a GitHub secret (§11.2) —
        # 1Password is the only durable store for it.
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2  # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CI_WRITEBACK_APP_ID: op://monadial-cloud/github-app-ci-writeback/credentials/app_id
          CI_WRITEBACK_PRIVATE_KEY: op://monadial-cloud/github-app-ci-writeback/credentials/private_key

      - name: Write-back target short name
        id: target
        env:
          WRITEBACK_REPO: ${{ inputs.writeback_repo }}
        run: |
          echo "short_name=${WRITEBACK_REPO##*/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ env.CI_WRITEBACK_APP_ID }}
          private-key: ${{ env.CI_WRITEBACK_PRIVATE_KEY }}
          owner: monadial
          repositories: ${{ steps.target.outputs.short_name }}

      - name: Checkout write-back target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.writeback_repo }}
          # ref: explicit — when writeback_repo == the calling repo,
          # checkout's default ref is the RUN's triggering SHA, so a push
          # from that base is rejected the moment ANY commit lands on main
          # after the run started (live-hit on the first verifier run,
          # 2026-08-26). Always write back on top of current main.
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Pin digest
        env:
          WRITEBACK_PATH: ${{ inputs.writeback_path }}
          WRITEBACK_REGEX: ${{ inputs.writeback_regex }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          match_count="$(grep -c -E "${WRITEBACK_REGEX}" "${WRITEBACK_PATH}")"
          if [ "${match_count}" -eq 0 ]; then
            echo "::error::writeback_regex '${WRITEBACK_REGEX}' matched nothing in ${WRITEBACK_PATH}." >&2
            echo "Refusing to write back a digest pin blindly — fix the regex or the path." >&2
            exit 1
          fi
          sed -E -i "s#${WRITEBACK_REGEX}#${IMAGE}@${DIGEST}#" "${WRITEBACK_PATH}"

      - name: Commit and push
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          WRITEBACK_PATH: ${{ inputs.writeback_path }}
        run: |
          if git diff --quiet -- "${WRITEBACK_PATH}"; then
            echo "No change — ${WRITEBACK_PATH} is already pinned to ${DIGEST}. Nothing to write back."
            exit 0
          fi
          git config user.name "monadial-ci-writeback[bot]"
          git config user.email "monadial-ci-writeback[bot]@users.noreply.github.com"
          git add "${WRITEBACK_PATH}"
          git commit -m "ci: pin ${IMAGE} to ${DIGEST}"
          # Rebase-retry: main can advance between checkout and push (other
          # write-backs, human commits). The pin edit is a single line with
          # a stable anchor, so a rebase is conflict-free unless the SAME
          # line changed — in which case failing is correct.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt ${attempt}) — rebasing onto latest main"
            git pull --rebase origin main
          done
          git push
