## monadial/.github reusable build workflow
##
## Build -> scan (Trivy, before push) -> push -> sign (cosign, keyless) -> write
## back the resulting digest into the calling app's deploy manifest in a
## SEPARATE repository, via a GitHub App installation token (never a repo/org
## PAT). See ../../WORKFLOWS.md for the full caller contract (required
## inputs/secrets, the paths-ignore loop-guard callers MUST set, and the
## action allowlist to paste into org Settings -> Actions -> "Allow select
## actions").
##
## v1.0.3 (2026-08-26, SUPERSEDED by v1.0.4 same day): first attempt at
## dual-publishing the cosign signature under the legacy pre-OCI-1.1
## `<repo>:sha256-<digest>.sig` tag via `cosign sign --registry-referrers-
## mode=legacy`. Live-tested against a real CI run and DISPROVEN: on this
## registry, that flag does not actually write a distinct `.sig`-suffixed
## tag (both the default and the explicit-legacy sign calls land on the
## same OCI-referrers fallback-tag index) — see v1.0.4's notes below and
## the `Publish legacy signature tag` step's own comment for the full
## live-diagnosis trail.
##
## v1.0.4 (2026-08-26, SUPERSEDED by v1.0.5 same day): got the TAG NAME
## right (`<repo>:sha256-<digest>.sig` did start existing) via a plain
## registry-API GET+PUT copy of the signature manifest `cosign sign`
## already published — but not the CONTENT SHAPE. Live-tested against a
## real CI run and DISPROVEN by the cluster's own reports-controller:
## Kyverno's vendored cosign v3.1.2 rejected the copied manifest ("no
## matching signatures: signature layer ... is missing
## \"dev.cosignproject.cosign/signature\" annotation") because `cosign
## sign` publishes the MODERN Sigstore-bundle-format signature, but
## Kyverno's legacy-tag reader only understands the OLDER "simple
## signing" annotation layout. See v1.0.5's notes below.
##
## v1.0.5 (2026-08-26, SUPERSEDED by v1.0.6 same day): reshaped v1.0.4's
## copy into the classic annotation layout Kyverno v3.1.2's legacy reader
## expects (`dev.cosignproject.cosign/signature` etc.) via `cosign attach
## signature` — independently verified all three annotations present on
## all three rebuilt images. Live-tested against the real cluster and
## STILL rejected, with a NEW, deeper error: "no matching signatures:
## error verifying bundle: matching bundle to payload" (a Rekor
## transparency-log ENTRY-TYPE mismatch, not an annotation-shape problem
## — see v1.0.6's notes below for the full root cause).
##
## v1.0.6 (2026-08-26): the working fix. Root cause of v1.0.5's failure,
## confirmed via cosign's own source (not assumed): modern cosign (v3,
## and this repo's own v3.0.6/v3.1.3) unconditionally wraps EVERY `cosign
## sign` payload in an in-toto Statement inside a DSSE envelope, recording
## a Rekor `"kind":"dsse"` entry — a fundamentally different transparency-
## log entry type from the `"kind":"hashedrekord"` entry (direct signature
## over raw payload bytes) the classic annotation layout was built around.
## No amount of annotation reshaping bridges two different Rekor entry
## kinds. Fix: install a SECOND, genuinely older cosign binary (v2.5.3 —
## the last major version before this DSSE-by-default shift, confirmed
## via its own sign.go source: plain `cosign sign` there signs the classic
## "SimpleContainerImage" payload directly, no DSSE, landing a real
## `hashedrekord` entry) and let IT independently sign + publish the
## legacy reference natively — not a reshape of the modern signature, a
## second, genuinely native one over the same digest, same OIDC identity.
## See the `build` job's `Install cosign (legacy)` / `Sign image (legacy
## format)` / `Verify legacy signature offline` steps for the full
## mechanics; the authoritative cluster-side diagnosis lives in
## monadial-cloud's own gitops/platform/kyverno/policies-images.yaml
## header comment.
##
## v1.0.7 (2026-08-27): SECURITY — input validation on the write-back
## substitution. The `Pin digest` step ran
## `sed -E -i "s#${WRITEBACK_REGEX}#${IMAGE}@${DIGEST}#"` with a
## caller-supplied `writeback_regex`. `#` is the s-expression delimiter
## there, so a `#` anywhere in that input closes the expression early and
## everything after it is read by sed as REPLACEMENT + FLAGS + further
## commands. GNU sed (what ubuntu-latest ships) has an `e` flag on `s///`
## that executes the result as a shell command — inside the one job that
## holds a live `monadial-ci-writeback` App installation token. Same
## reasoning applies to `image`, which is also a caller input and also
## interpolated into the same expression. Callers are trusted today (this
## is a private-org reusable workflow, and every caller is in this org),
## which is why this is a shape fix rather than an incident — but "the
## input happens to be trustworthy" is not a control, and this one is
## cheap: reject `#` in either input, and require `digest` to be a literal
## `sha256:<64 hex>`. Found by the Phase 5 whole-branch final review
## (finding 9). No behavioural change for any well-formed caller.
##
## v1.0.8 (2026-09-01): the Trivy gate now passes `ignore-unfixed: true`,
## making the step match what every doc already said it does ("gates on
## fixable HIGH/CRITICAL"). The gap never fired before because hello
## (distroless) and infra-docs (alpine) carry zero UNFIXED HIGH/CRITICAL
## findings; aktum's node:22-slim images are the first debian-slim through
## this pipeline, and debian 12 ships several HIGH/CRITICAL CVEs with no
## fix available (zlib CVE-2023-45853 will_not_fix, perl fix_deferred,
## bsdutils affected) that no apt-get upgrade can remove. Blocking on those
## gates nothing actionable; they still appear in the scan output. Fixable
## findings block exactly as before.
##
## v1.0.9 (2026-09-02): cross-org write-back. The token-mint step
## hardcoded `owner: monadial`, so a writeback_repo in another org asked
## for an installation of monadial/<short-name> and 404ed (first hit:
## aktumhq/aktum). The owner is now derived from writeback_repo itself;
## the App must simply be installed on the target org with access to the
## target repo. No change for same-org callers.
##
## Every third-party `uses:` below is pinned to a full 40-char commit SHA,
## with the human-readable release tag it currently resolves to as a
## trailing comment. Re-resolve with:
##   gh api repos/<owner>/<repo>/commits/<tag> --jq '.sha'
## (dereferences annotated tags to the commit automatically) before bumping
## any pin.

name: build

# Quoted: bare `on:` is a YAML 1.1 boolean literal (resolves to `true`) —
# quoting keeps it a string key so strict YAML linters don't flag it.
# GitHub's own workflow parser accepts either form identically.
"on":
  workflow_call:
    inputs:
      image:
        description: >-
          Fully-qualified image repository, no tag/digest, e.g.
          rg.nl-ams.scw.cloud/monadial/hello
        required: true
        type: string
      context:
        description: Docker build context path, relative to the calling repo root.
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile, relative to the calling repo root.
        required: true
        type: string
      writeback_repo:
        description: >-
          owner/repo of the deploy-manifest repository to pin the built
          digest into, e.g. monadial/hello
        required: true
        type: string
      writeback_path:
        description: >-
          Path (within writeback_repo) to the file whose image reference
          line gets updated to the new digest.
        required: true
        type: string
      writeback_regex:
        description: >-
          Extended-regex (grep -E / sed -E compatible) matching the exact
          image reference line/value in writeback_path to replace. Must
          match at least one line or the write-back job fails on purpose.
          MUST NOT CONTAIN '#' — it is the delimiter of the `sed`
          s-expression this value is interpolated into, and the write-back
          job rejects it outright (v1.0.7). The same applies to `image`.
          The check is a raw-substring test, so a bracket expression like
          [#] is refused too; a container image reference never needs one.
        required: true
        type: string
      platforms:
        description: Comma-separated buildx platform list. Single-platform only (load+push flow).
        required: false
        type: string
        default: linux/amd64
      tag:
        description: >-
          Tag to build/scan/push under before signing by digest. Defaults
          to the calling workflow run's commit SHA when not supplied.
        required: false
        type: string
        default: ""
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: >-
          Org-level 1Password service-account token (read-only, vault
          monadial-cloud). Required — this workflow authenticates to
          1Password with it in every job. If the org secret does not
          exist or is not shared with the calling repo, every job fails
          fast with an explicit ::error:: rather than a cryptic
          1Password-CLI auth failure.
        required: true
    outputs:
      digest:
        description: sha256 digest of the pushed, signed image.
        value: ${{ jobs.build.outputs.digest }}

# Hygiene default (§11.4): no ambient token permissions anywhere in this
# workflow unless a job explicitly grants itself what it needs.
permissions: {}

jobs:
  build:
    name: build, scan, push, sign
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # cosign keyless: mints the OIDC token Fulcio exchanges for a cert
      contents: read  # actions/checkout of the calling repo
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Preflight — verify OP_SERVICE_ACCOUNT_TOKEN is present
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if [ -z "${OP_SERVICE_ACCOUNT_TOKEN}" ]; then
            echo "::error::OP_SERVICE_ACCOUNT_TOKEN org secret is missing or empty." >&2
            echo "This workflow needs it to authenticate to 1Password (vault monadial-cloud)." >&2
            echo "See WORKFLOWS.md prerequisite 3 — ask an org admin to share the org secret with this repo." >&2
            exit 1
          fi

      - name: Load registry push credentials from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2  # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCW_ACCESS_KEY: op://monadial-cloud/scw-registry-push-ci/credentials/access_key
          SCW_SECRET_KEY: op://monadial-cloud/scw-registry-push-ci/credentials/secret_key

      - name: Determine build tag
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker login (Scaleway registry)
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          registry="${IMAGE%%/*}"
          echo "${SCW_SECRET_KEY}" | docker login "${registry}" --username "${SCW_ACCESS_KEY}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build image (local only — nothing pushed yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: false
          load: true
          tags: ${{ inputs.image }}:${{ steps.vars.outputs.tag }}

      - name: Scan with Trivy (gate — must pass before anything is pushed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ inputs.image }}:${{ steps.vars.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          # v1.0.8: gate on FIXABLE findings only - see the version history
          # comment at the top of this file.
          ignore-unfixed: true

      - name: Push image (the exact scanned bytes)
        # Review fix (T3, 2026-08-26): a second build-push-action call here
        # was a REBUILD whose identity with the scanned image rested on an
        # unproven cache hit — the classic scan-then-swap window. A plain
        # `docker push` of the tag ALREADY LOADED into the daemon pushes the
        # byte-identical image Trivy just scanned, by construction.
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker push "${IMAGE}:${TAG}"

      - name: Resolve pushed digest
        id: digest
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          # Pull (rather than trust the local buildx load) so the local
          # daemon records RepoDigests against a reference it fetched from
          # the registry itself.
          docker pull "${IMAGE}:${TAG}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${TAG}" | sed -E 's#^.*@##')"
          if [ -z "${digest}" ]; then
            echo "::error::Could not resolve a pushed digest for ${IMAGE}:${TAG} — RepoDigests empty after pull." >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          # Keyless: identity = this job's OIDC token (id-token: write
          # above), Fulcio-issued short-lived cert, Rekor transparency-log
          # entry. cosign >=2.x bundles the Rekor SET into the signature by
          # default, so `cosign verify --offline --bundle` works later
          # without a live Rekor round-trip (§1).
          #
          # No --registry-referrers-mode flag here: cosign's own default
          # (OCI 1.1 Referrers API, falling back transparently to the
          # OCI-1.1 "fallback tag" object <repo>:sha256-<digest> — no
          # `.sig` suffix — on registries like Scaleway's that don't
          # implement the native Referrers API) is what this repo has
          # always published under. Kept unchanged; the dual-publish step
          # immediately below ADDS the legacy reference on top of this,
          # it doesn't replace it.
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify signature offline (Rekor bundle attached — §1 requirement)
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          # Proves the just-created signature verifies WITHOUT network access
          # to Rekor (bundle embedded) — the offline-capability the cluster's
          # verifyImages admission relies on during a Sigstore outage.
          cosign verify --offline \
            --certificate-identity-regexp '^https://github.com/monadial/\.github/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"

      - name: Install cosign (legacy — Kyverno-vendored-cosign compatibility)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v2.5.3
          install-dir: /home/runner/.cosign-legacy

      - name: Sign image (legacy format — Kyverno-vendored-cosign compatibility)
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          # WHY a second, OLDER cosign BINARY (not another flag/reshape
          # attempt on the modern one) — full history, newest first, read
          # before touching this:
          #
          # v1.0.3 tried `cosign sign --registry-referrers-mode=legacy`
          # (modern cosign v3): live-disproven, landed on the same
          # fallback-tag index as the default call, no `.sig` tag ever
          # created.
          #
          # v1.0.4 tried copying the modern signature manifest verbatim to
          # the `.sig` tag via raw registry GET+PUT: got the TAG NAME
          # right but not the CONTENT — Kyverno's vendored cosign v3.1.2
          # rejected it live ("no matching signatures: signature layer ...
          # is missing \"dev.cosignproject.cosign/signature\" annotation")
          # because modern `cosign sign` publishes a
          # `dev.sigstore.bundle.v0.3+json` layer, not the classic
          # annotation-based shape Kyverno's legacy reader parses.
          #
          # v1.0.5 tried reshaping the SAME modern signature into the
          # classic annotation layout (`cosign attach signature` with
          # extracted payload/sig/cert/Rekor-proof): got the ANNOTATIONS
          # right too (independently verified all three present), but
          # Kyverno STILL rejected it live with a NEW error — "no matching
          # signatures: error verifying bundle: matching bundle to
          # payload" (bundle/payload hash mismatch). Root cause, confirmed
          # via cosign's own source (not assumed): modern `cosign sign`
          # (even for plain image signing, no `cosign attest` involved)
          # unconditionally wraps the payload in an in-toto Statement
          # inside a DSSE envelope and records a Rekor `"kind":"dsse"`
          # entry (envelopeHash + payloadHash, PAE-signed) — a
          # fundamentally different transparency-log entry TYPE from the
          # `"kind":"hashedrekord"` entry (direct signature over the raw
          # payload bytes, no DSSE/PAE) that Kyverno's legacy reader was
          # built around. No annotation reshaping can bridge two different
          # Rekor entry types; confirmed via
          # `cmd/cosign/cli/sign/sign.go` at both the installed v3.0.6 and
          # v3.1.3 tags having zero "hashedrekord"/DSSE branching for
          # plain `sign` — it is unconditionally DSSE now, no CLI flag
          # reverts it (`--new-bundle-format` does not exist on `cosign
          # sign` in this cosign major version; confirmed via --help, not
          # assumed).
          #
          # v1.0.6 (this version): cosign v2.5.3 (the last cosign major
          # before this DSSE-by-default shift, confirmed via its own
          # `cmd/cosign/cli/sign/sign.go` source: plain `cosign sign` uses
          # `sigstore/pkg/signature/payload.Cosign{}` — the classic
          # "SimpleContainerImage" JSON — signed directly, no DSSE
          # wrapping, landing a genuine `hashedrekord` Rekor entry) signs
          # a SECOND, independent, genuinely native legacy-format
          # signature over the exact same digest, using the exact same
          # OIDC identity (this job's id-token). This isn't a reshape of
          # the modern signature — it's cosign's own OLDER, still-fully-
          # supported code producing the format Kyverno's vendored cosign
          # v3.1.2 actually understands, natively, the way it was always
          # meant to be produced. `cosign-installer`'s own version floor
          # (checked in its action.yml, not assumed) only rejects releases
          # below v2.0.0, so v2.5.3 installs cleanly alongside the modern
          # binary above (distinct install-dir so neither clobbers the
          # other on PATH).
          #
          # Full diagnosis history:
          # gitops/platform/kyverno/policies-images.yaml (monadial-cloud
          # repo) header comment.
          /home/runner/.cosign-legacy/cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify legacy signature offline (Kyverno-vendored-cosign compatibility)
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          # Same offline-capability proof as the modern verify step above,
          # but using the OLD cosign binary against its OWN just-published
          # signature — gate and cluster read the exact same format this
          # way, not two different ones that happen to both currently
          # pass.
          /home/runner/.cosign-legacy/cosign verify --offline \
            --certificate-identity-regexp '^https://github.com/monadial/\.github/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"

      - name: Verify legacy signature tag exists (Kyverno-vendored-cosign compatibility)
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          # Real registry round-trip proving the tag the step above
          # published is actually fetchable AND correctly shaped by the
          # exact access pattern Kyverno's vendored cosign uses — not a
          # cosign opinion, a plain `docker manifest inspect` of the
          # computed tag name (cosign's own legacy AttachedImageTag
          # convention: <algo>-<hex>.sig): asserts it's a bare OCI image
          # manifest (not an index) carrying the classic
          # `dev.cosignproject.cosign/signature` layer annotation — the
          # exact shape check that would have caught both v1.0.4's (wrong
          # content entirely) and v1.0.5's (right annotations, wrong Rekor
          # entry type underneath) regressions before they ever reached
          # the cluster, though not the Rekor-entry-type problem itself
          # (that's only provable by the offline-verify step above and the
          # cluster's own PolicyReport).
          sig_tag="sha256-${DIGEST#sha256:}.sig"
          echo "Checking for legacy signature tag: ${IMAGE}:${sig_tag}"
          manifest="$(docker manifest inspect "${IMAGE}:${sig_tag}")"
          media_type="$(echo "${manifest}" | jq -r '.mediaType')"
          sig_annotation_jq='.layers[0].annotations."dev.cosignproject.cosign/signature" // empty'
          sig_annotation="$(echo "${manifest}" | jq -r "${sig_annotation_jq}")"
          echo "mediaType: ${media_type}"
          if [ "${media_type}" != "application/vnd.oci.image.manifest.v1+json" ]; then
            echo "::error::${IMAGE}:${sig_tag} is not a bare OCI image manifest (got mediaType=${media_type})." >&2
            exit 1
          fi
          if [ -z "${sig_annotation}" ]; then
            echo "::error::${IMAGE}:${sig_tag} layer is missing the" >&2
            echo "::error::signature annotation Kyverno's legacy reader requires." >&2
            exit 1
          fi

  writeback:
    name: write back pinned digest
    needs: build
    runs-on: ubuntu-latest
    # NOT contents:write. contents:write on the GITHUB_TOKEN would only
    # grant push rights on the repo THIS workflow is running in (the
    # caller) — irrelevant, since the commit below targets a different
    # repository (writeback_repo). The actual write authority comes
    # entirely from the short-lived GitHub App installation token minted
    # below, scoped by the App install to writeback_repo only. Keeping the
    # ambient GITHUB_TOKEN at contents:read (unused, but the conservative
    # non-empty default) means a bug in this job can never fall back to
    # writing to the calling repo with elevated rights.
    permissions:
      contents: read
    steps:
      - name: Preflight — verify OP_SERVICE_ACCOUNT_TOKEN is present
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if [ -z "${OP_SERVICE_ACCOUNT_TOKEN}" ]; then
            echo "::error::OP_SERVICE_ACCOUNT_TOKEN org secret is missing or empty." >&2
            echo "This workflow needs it to authenticate to 1Password (vault monadial-cloud)." >&2
            echo "See WORKFLOWS.md prerequisite 3 — ask an org admin to share the org secret with this repo." >&2
            exit 1
          fi

      - name: Load GitHub App credentials from 1Password
        # App private key is loaded straight from 1Password into this
        # job's environment and never becomes a GitHub secret (§11.2) —
        # 1Password is the only durable store for it.
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2  # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CI_WRITEBACK_APP_ID: op://monadial-cloud/github-app-ci-writeback/credentials/app_id
          CI_WRITEBACK_PRIVATE_KEY: op://monadial-cloud/github-app-ci-writeback/credentials/private_key

      - name: Write-back target owner and short name
        id: target
        env:
          WRITEBACK_REPO: ${{ inputs.writeback_repo }}
        run: |
          echo "owner=${WRITEBACK_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "short_name=${WRITEBACK_REPO##*/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ env.CI_WRITEBACK_APP_ID }}
          private-key: ${{ env.CI_WRITEBACK_PRIVATE_KEY }}
          # v1.0.9: derive the owner from writeback_repo instead of the
          # hardcoded `monadial` - the App is installed per target org, and
          # a cross-org caller (first: aktumhq/aktum) 404s on the token
          # mint otherwise. Same-org callers resolve identically.
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.short_name }}

      - name: Checkout write-back target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.writeback_repo }}
          # ref: explicit — when writeback_repo == the calling repo,
          # checkout's default ref is the RUN's triggering SHA, so a push
          # from that base is rejected the moment ANY commit lands on main
          # after the run started (live-hit on the first verifier run,
          # 2026-08-26). Always write back on top of current main.
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Pin digest
        env:
          WRITEBACK_PATH: ${{ inputs.writeback_path }}
          WRITEBACK_REGEX: ${{ inputs.writeback_regex }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          # v1.0.7 SECURITY GATE — validate BEFORE the substitution.
          #
          # WRITEBACK_REGEX and IMAGE are both caller-supplied, and both are
          # interpolated into a `sed` s-expression whose delimiter is '#'.
          # A '#' anywhere in either value terminates that expression early;
          # everything after it is then read by sed as replacement text,
          # FLAGS and further commands. GNU sed (what ubuntu-latest ships)
          # honours an `e` flag on `s///` that executes the result as a
          # shell command — in the one job holding a live write-back App
          # installation token.
          #
          # Reject rather than escape. The check is a plain substring test
          # on the RAW character, so even a character class like [#] is
          # refused: a substring test is auditable at a glance, whereas
          # "is this '#' inside a bracket expression?" means parsing ERE,
          # and no caller has ever needed to match a literal hash inside a
          # container image reference. A refused build is strictly better
          # than a build that silently runs caller-chosen shell.
          case "${WRITEBACK_REGEX}" in
            *'#'*)
              echo "::error::writeback_regex contains '#', the sed s-expression delimiter this step uses." >&2
              echo "Refusing to substitute — a '#' here terminates the expression and can inject sed flags/commands (GNU sed's s///e executes shell)." >&2
              exit 1
              ;;
          esac
          case "${IMAGE}" in
            *'#'*)
              echo "::error::image contains '#', the sed s-expression delimiter this step uses." >&2
              echo "Refusing to substitute — see the writeback_regex error above for why." >&2
              exit 1
              ;;
          esac
          # DIGEST is produced by `docker inspect` in the build job rather
          # than by a caller, but it crosses a job boundary as an output, so
          # it is pinned to its exact expected literal shape as well.
          if ! printf '%s' "${DIGEST}" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::digest '${DIGEST}' is not a literal sha256:<64 hex> reference." >&2
            exit 1
          fi

          match_count="$(grep -c -E "${WRITEBACK_REGEX}" "${WRITEBACK_PATH}")"
          if [ "${match_count}" -eq 0 ]; then
            echo "::error::writeback_regex '${WRITEBACK_REGEX}' matched nothing in ${WRITEBACK_PATH}." >&2
            echo "Refusing to write back a digest pin blindly — fix the regex or the path." >&2
            exit 1
          fi
          sed -E -i "s#${WRITEBACK_REGEX}#${IMAGE}@${DIGEST}#" "${WRITEBACK_PATH}"

      - name: Commit and push
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          WRITEBACK_PATH: ${{ inputs.writeback_path }}
        run: |
          if git diff --quiet -- "${WRITEBACK_PATH}"; then
            echo "No change — ${WRITEBACK_PATH} is already pinned to ${DIGEST}. Nothing to write back."
            exit 0
          fi
          git config user.name "monadial-ci-writeback[bot]"
          git config user.email "monadial-ci-writeback[bot]@users.noreply.github.com"
          git add "${WRITEBACK_PATH}"
          git commit -m "ci: pin ${IMAGE} to ${DIGEST}"
          # Rebase-retry: main can advance between checkout and push (other
          # write-backs, human commits). The pin edit is a single line with
          # a stable anchor, so a rebase is conflict-free unless the SAME
          # line changed — in which case failing is correct.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt ${attempt}) — rebasing onto latest main"
            git pull --rebase origin main
          done
          git push
